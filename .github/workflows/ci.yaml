name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -r requirements.txt pytest ruff pyyaml httpx
      - name: Lint
        run: ruff check app tests tools
      - name: Unit tests
        run: pytest -q
      - name: Validate application manifests
        run: python tools/validate_manifests.py k8s/base
      - name: Prove insecure fixture is rejected
        run: |
          if python tools/validate_manifests.py examples/insecure; then
            echo "The insecure fixture unexpectedly passed" >&2
            exit 1
          fi
      - name: Render Kustomize overlays
        run: |
          kubectl kustomize k8s/overlays/dev > dev-rendered.yaml
          kubectl kustomize k8s/overlays/production > production-rendered.yaml
      - name: Kubernetes schema validation
        run: docker run --rm -v "${{ github.workspace }}:/work" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /work/dev-rendered.yaml /work/production-rendered.yaml
      - name: Kubernetes workload quality score
        run: docker run --rm -v "${{ github.workspace }}:/work" zegl/kube-score:v1.20.0 score --exit-one-on-warning /work/dev-rendered.yaml
      - name: Prove kube-score rejects the insecure fixture
        run: |
          if docker run --rm -v "${{ github.workspace }}:/work" zegl/kube-score:v1.20.0 score --exit-one-on-warning /work/examples/insecure/deployment.yaml; then
            echo "kube-score unexpectedly accepted the insecure fixture" >&2
            exit 1
          fi
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Validate Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile
      - name: Build application image
        run: docker build --tag cloudscale-logistics:${{ github.sha }} .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudscale-logistics:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
